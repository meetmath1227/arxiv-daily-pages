a.catbtn.empty{opacity:.38;pointer-events:none;text-decoration:line-through}
.themes{margin-left:auto;display:flex;gap:6px}
.themes button{cursor:pointer;border-radius:8px;padding:2px 12px;font-size:12.5px;border:1px solid var(--line);background:var(--chip);color:var(--fg)}
.themes button.active{outline:2px solid var(--acc);font-weight:700}
.wrap{max-width:960px;margin:0 auto;padding:84px 20px 64px}
header h1{font-size:26px;letter-spacing:.5px}
header .date{color:var(--sub);margin-top:6px;font-size:14px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--sub)}

<script>
(function(){
  var KEY='arxiv-daily-theme';
  var btns=document.querySelectorAll('.themes button');
  function apply(t){
    if(['black','yellow','white'].indexOf(t)<0){t='black';}
    document.body.setAttribute('data-theme',t);
    for(var i=0;i<btns.length;i++){
      btns[i].className=(btns[i].getAttribute('data-theme')===t)?'active':'';
    }
    try{localStorage.setItem(KEY,t);}catch(e){}
  }
  for(var i=0;i<btns.length;i++){
    (function(b){b.addEventListener('click',function(){apply(b.getAttribute('data-theme'));});})(btns[i]);
  }
  var s=null;try{s=localStorage.getItem(KEY);}catch(e){}
  apply(s||'black');
})();
</script>
